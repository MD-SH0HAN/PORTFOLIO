groups:
  - name: observability-lab
    rules:
      - alert: ApiScrapeMissing
        expr: up{job="observability-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Observability lab API is not being scraped
          description: Prometheus has not successfully scraped the API for at least one minute.

      - alert: Elevated5xxRate
        expr: |
          sum(rate(http_requests_total{job="observability-api",status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total{job="observability-api"}[5m])), 0.001) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx ratio is elevated
          description: More than 5% of observed HTTP requests have returned a 5xx status during the evaluation window.

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="observability-api"}[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency is above 500 ms
          description: The estimated 95th percentile HTTP request duration has exceeded 500 ms.
